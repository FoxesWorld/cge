plugins {
    id 'java'
    id 'application'
}

group = 'org.foxesworld.cge'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Основные модули jMonkeyEngine
    implementation 'org.jmonkeyengine:jme3-core:3.8.1-stable'
    implementation 'org.jmonkeyengine:jme3-desktop:3.8.1-stable'
    implementation 'org.jmonkeyengine:jme3-lwjgl3:3.8.1-stable'
    implementation 'org.jmonkeyengine:jme3-effects:3.8.1-stable'
    implementation files("lib/SkyControl-1.1.0.jar")
    runtimeOnly("org.jmonkeyengine:jme3-awt-dialogs:3.8.1-stable")

    // GSON для загрузки конфигурации из JSON
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    implementation 'org.fusesource.jansi:jansi:2.4.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation("org.slf4j:jul-to-slf4j:2.0.0")

    implementation 'com.github.stephengold:Minie:9.0.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //UI
    implementation 'com.formdev:flatlaf:3.4.1'

    // Дополнительные темы (опционально)
    implementation 'com.formdev:flatlaf-extras:3.4.1'
}

application {
    mainClass = 'org.foxesworld.cge.CalistaGameEngine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
