plugins {
    id 'java'
    id 'application'
}

group = 'org.foxesworld.cge'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
ext {
    jmeVersion = '3.9.0-alpha3'
}

dependencies {
    // Основные модули jMonkeyEngine
    implementation "org.jmonkeyengine:jme3-core:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-effects:$jmeVersion"
    implementation files("lib/SkyControl-1.1.0.jar")
    implementation files("lib/jme_phonon-0.3.7.jar")
    implementation "org.jmonkeyengine:jme3-jogg:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-awt-dialogs:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-niftygui:3.9.0-alpha1"
    implementation 'org.jmonkeyengine:jme3-plugins:3.8.1-stable'

    // GSON для загрузки конфигурации из JSON
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.1'

    // JAXB Runtime - Реализация (движок), которая выполняет парсинг XML.
    // Это код, который *делает* работу.
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    implementation 'com.simsilica:zay-es:1.6.0'

    // https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.8")

    // Логгирование
    implementation 'org.fusesource.jansi:jansi:2.4.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.slf4j:jul-to-slf4j:2.0.0'

    // Физика Minie
    implementation 'com.github.stephengold:Minie:9.0.1'

    // UI: FlatLaf
    implementation 'com.formdev:flatlaf:3.4.1'
    implementation 'com.formdev:flatlaf-extras:3.4.1'
    implementation 'uk.co.caprica:vlcj:4.7.1'
}

application {
    mainClass = 'test.Game'
    applicationDefaultJvmArgs = [
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-exports=java.desktop/com.sun.media.sound=ALL-UNNAMED',
            '-XX:+UseZGC',
            '-XX:MaxGCPauseMillis=5',
            '-Xss512k',
            '-Xms4G',
            '-Xmx4G'
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}