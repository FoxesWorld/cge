# ===== CORE COLORS =====
@background = #232326
@foreground = #F5F7FA
@accentPrimary = #E05656
@accentSecondary = #B24C4C
@accentTertiary = #6869EF
@errorColor = #EF4444
@warningColor = #F59E0B
@successColor = #4ADE80

# ===== DEPTH SYSTEM =====
@surface1 = #232326
@surface2 = #343438
@surface3 = #29292C
@overlay  = #000000CC

# ===== COMPONENT PROFILE =====
Component.arc = 8
Component.borderWidth = 1
Component.focusWidth = 1.4
Component.focusColor = @accentTertiary
Component.shadow = 0 3px 12px #00000028
Component.animationDuration = 220

# ===== ACTION CONTROLS =====
Button.arc = 8
Button.background = #232326
Button.foreground = @foreground

Button.hoverBackground = #E0565615
Button.pressedBackground = #E0565632

Button.borderColor = @accentPrimary

Button.default.background = @accentPrimary
Button.default.foreground = #FFFFFF
Button.default.borderColor = @accentSecondary

Button.success.background = @successColor
Button.success.foreground = #232326

Button.warning.background = @warningColor
Button.warning.foreground = #232326

Button.error.background = @errorColor
Button.error.foreground = #FFFFFF

# ===== DATA VISUALIZATION =====
ProgressBar.arc = 5
ProgressBar.foreground = @accentPrimary
ProgressBar.background = @surface2
ProgressBar.horizontalHeight = 7

# ===== INTERFACE ELEMENTS =====
Table.background = @surface1
Table.gridColor = #39393C
Table.selectionBackground = #E0565618
TableHeader.background = @surface2
TableHeader.bottomSeparatorColor = #39393C
TableHeader.textColor = @accentTertiary

# ===== GLASS EFFECTS =====
ViewportToolbar.background = #232326CC
Gizmo.xColor = @accentPrimary
Gizmo.yColor = @accentSecondary
Gizmo.zColor = @accentTertiary

# ===== ENHANCED TYPOGRAPHY =====
TextComponent.selectionBackground = #E0565618
TextComponent.borderColor = #39393C
TextComponent.placeholderColor = #6869EF99

# ===== CONTEXT UI =====
ToolTip.background = #2D2D30
ToolTip.foreground = #F5F7FA
ToolTip.borderColor = @accentTertiary
Menu.selectionBackground = #E0565618
ScrollBar.thumb = #39393C
ScrollBar.thumbHover = #6869EF

# ===== BADGES & TAGS =====
Badge.background = @accentTertiary
Badge.foreground = #FFFFFF
Badge.borderColor = @accentSecondary

Tag.background = #39393C
Tag.foreground = #F5F7FA
Tag.borderColor = @accentPrimary

# ===== SWITCH & TOGGLE =====
Switch.track = #39393C
Switch.trackChecked = @accentTertiary
Switch.thumb = #F5F7FA

# ===== MODAL =====
Modal.background = #232326F2
Modal.shadow = 0 8px 32px #00000040

# ===== FOCUS & OUTLINE =====
Focus.outline = 0 0 0 2px #6869EF88