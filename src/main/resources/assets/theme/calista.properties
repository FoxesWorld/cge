# ===== CORE COLORS =====
@background = #2D2D30
@foreground = #FFFFFF
@accentPrimary = #DC5050
@accentSecondary = #B24C4C
@errorColor = #EF4444
@warningColor = #F59E0B

# ===== DEPTH SYSTEM =====
@surface1 = #232326
@surface2 = #39393C
@surface3 = #2D2D30
@overlay = #000000C8

# ===== COMPONENT PROFILE =====
Component.arc = 6
Component.borderWidth = 0.8
Component.focusWidth = 1.2
Component.focusColor = @accentPrimary
Component.shadow = 0 2px 8px #00000020
Component.animationDuration = 200

# ===== ACTION CONTROLS =====
Button.arc = 6
Button.background = #232326
Button.foreground = @foreground

Button.hoverBackground = #DC505015
Button.pressedBackground = #DC505032

Button.borderColor = #DC5050

Button.default.background = #DC5050
Button.default.foreground = #FFFFFF
Button.default.borderColor = #B24C4C

# ===== DATA VISUALIZATION =====
ProgressBar.arc = 4
ProgressBar.foreground = #DC5050
ProgressBar.background = @surface2
ProgressBar.horizontalHeight = 6

# ===== INTERFACE ELEMENTS =====
Table.background = @surface1
Table.gridColor = #39393C
Table.selectionBackground = #DC505018
TableHeader.background = @surface2
TableHeader.bottomSeparatorColor = #39393C

# ===== GLASS EFFECTS =====
ViewportToolbar.background = #232326CC
Gizmo.xColor = #DC5050
Gizmo.yColor = #B24C4C
Gizmo.zColor = #6869EF

# ===== ENHANCED TYPOGRAPHY =====
TextComponent.selectionBackground = #DC505018
TextComponent.borderColor = #39393C

# ===== CONTEXT UI =====
ToolTip.background = #232326
ToolTip.foreground = #FFFFFF
Menu.selectionBackground = #DC505018
ScrollBar.thumb = #39393C
ScrollBar.thumbHover = #6869EF